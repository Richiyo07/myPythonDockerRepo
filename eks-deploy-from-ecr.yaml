
apiVersion: v1
kind: Namespace
metadata:
  name: python-app-ns

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-app
  namespace: python-app-ns
  labels:
    app: python-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: python-app
  template:
    metadata:
      labels:
        app: python-app
    spec:
      containers:
        - name: python-app
          image: 136356824322.dkr.ecr.us-east-2.amazonaws.com/richspace/dodo-repo:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: http

---
apiVersion: v1
kind: Service
metadata:
  name: python-app-service
  namespace: python-app-ns
spec:
  type: LoadBalancer
  selector:
    app: python-app
  ports:
    - name: http
      port: 80
      targetPort: 5000
      protocol: TCP
